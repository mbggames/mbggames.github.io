<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Am I? · MBG Games</title>
<meta name="description" content="Who Am I? What am I? Where am I? When am I? A guessing game with yes/no questions in English, Albanian, German and Bosnian by MBG – Merkur Beqiri Games.">
<meta name="theme-color" content="#E6EBEF">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/whoami.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/daily.css">
</head>
<body class="home-page">
<div class="home home2" id="home">
  <header class="topbar appbar">
    <button type="button" class="brand brandbtn" id="btnTop">
      <span class="mark" aria-hidden="true"><span class="mt o">M</span><span class="mt q">B</span><span class="mt x">G</span></span>
      <span class="brandtext">
        <span class="appname" id="appName">Who Am I?</span>
        <span class="appby" id="appBy">by MBG · Merkur Beqiri Games</span>
      </span>
    </button>
    <div class="tools">
      <button type="button" class="ib" id="btnLang"></button>
      <button type="button" class="ib ib-acc" id="btnAcc"></button>
    </div>
  </header>

  <main class="home-main">
    <p class="demoline" id="demoLine" hidden></p>
    <section class="welcomecard" id="welcomeCard" aria-labelledby="wlcTitle" hidden></section>

    <section class="hero hero2" id="hero">
      <div class="hero-card" aria-hidden="true">
        <div class="fcard back"><span>?</span></div>
        <div class="fcard front"><span class="fc-mode" id="heroMode">👤</span><span class="fc-q">?</span><span class="fc-word" id="heroWord">WHO</span></div>
      </div>
      <h1 id="heroTitle">Who am I?</h1>
      <p class="hero-sub" id="heroText"></p>
      <button type="button" class="btn submit playbig" id="btnQuick">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg>
        <span class="pb-t"><span class="pb-main" id="lblQuick">Play</span><span class="pb-sub" id="heroLast"></span></span>
      </button>
      <button type="button" class="btn ghost choosebtn" id="btnSetup"></button>
    </section>

    <section class="dailycard" id="dailyCard" aria-label="Puzzle of the day" hidden></section>

    <section class="plancard" id="planCard" hidden></section>

    <details class="explore" id="explore">
      <summary><span class="ex-t"><strong id="exploreTitle"></strong><span id="exploreText"></span></span></summary>
      <nav class="modes" id="modes" aria-label="What · Where · When"></nav>
    </details>

    <section class="topcard" id="topCard" aria-labelledby="topTitle">
      <div class="tc-head">
        <div class="tc-ht"><h2 id="topTitle"></h2><p class="tc-sub" id="topSub"></p></div>
      </div>
      <ol class="tc-list" id="topList"></ol>
      <button type="button" class="tc-me" id="meRow"></button>
      <button type="button" class="btn ghost hofbtn" id="btnHof"></button>
    </section>

    <section class="aboutcard" id="aboutCard"></section>

    <footer class="homefoot">
      <a href="privacy.html" id="lnkPrivacy">Privacy policy</a>
      <span id="version"></span>
      <span>© 2026 MBG · Merkur Beqiri Games</span>
      <span class="powered" id="powered">Powered by MBG Games</span>
    </footer>
  </main>

  <nav class="tabbar" id="tabBar" aria-label="Menu">
    <button type="button" class="tab on" id="tabHome" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span id="lblTabHome">Home</span></button>
    <button type="button" class="tab" id="tabTop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5h9v4a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6H4.5a3 3 0 0 0 3 4M16.5 6h3a3 3 0 0 1-3 4"/><path d="M12 13v3.5M8.5 20h7l-1-3.5h-5z"/></svg><span id="lblTabTop">Top 20</span></button>
    <button type="button" class="tab bell" id="btnBell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="badge-n" id="bellN" hidden></span><span id="lblTabInbox">Inbox</span></button>
    <button type="button" class="tab" id="tabMenu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></svg><span id="lblTabMenu">Menu</span></button>
  </nav>
</div>

<div class="goodbye" id="goodbye" hidden>
  <div class="gb-inner">
    <div class="gb-mark" aria-hidden="true"><span class="mt o">M</span><span class="mt q">B</span><span class="mt x">G</span></div>
    <h2 id="gbTitle"></h2>
    <p id="gbText"></p>
    <p class="gb-sign" id="gbSign"></p>
    <p class="gb-close" id="gbClose"></p>
    <button type="button" class="btn submit" id="gbAgain"></button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
