<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBG Puzzles</title>
<meta name="description" content="Codebreaker and Word Puzzle: two guessing games in English, Albanian, Bosnian, German, Spanish, French, Turkish, Polish, Portuguese and Arabic by MBG – Merkur Beqiri Games.">
<meta name="theme-color" content="#E6EBEF">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/preview.css">
</head>
<body class="home-page">
<div class="home" id="home">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"><span class="mt o">M</span><span class="mt q">B</span><span class="mt x">G</span></div>
      <div class="brandtext">
        <span class="appname" id="appName">MBG Puzzles</span>
        <span class="appby" id="appBy">by MBG · Merkur Beqiri Games</span>
      </div>
    </div>
    <div class="tools">
      <button type="button" class="ib" id="btnLang"></button>
      <button type="button" class="ib" id="btnExit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v8"/><path d="M7.1 6.6a7.5 7.5 0 1 0 9.8 0"/></svg>
      </button>
    </div>
  </header>

  <section class="plancard" id="planCard" aria-live="polite">
    <div class="pc-text">
      <span class="pc-k" id="planK">Your plan</span>
      <strong class="pc-title" id="planTitle"></strong>
      <span class="pc-sub" id="planSub"></span>
    </div>
    <button type="button" class="btn ghost small" id="btnPlans">See plans</button>
  </section>

  <section class="promo" id="promo">
    <div class="promo-mark" aria-hidden="true"><span class="mt o">7</span><span class="mt q">A</span></div>
    <div class="promo-text"><strong id="promoTitle"></strong><span id="promoText"></span></div>
  </section>

  <section class="dailycard" id="dailyCard" aria-labelledby="dailyTitle">
    <div class="dc-head"><strong id="dailyTitle"></strong><span class="dc-no" id="dailyNo"></span></div>
    <a class="dc-row" href="codebreaker.html?daily=1" id="dailyCode" data-game="codebreaker">
      <span class="dc-ic mt o" aria-hidden="true">7</span>
      <span class="dc-text"><strong id="dailyCodeName"></strong><span id="dailyCodeState"></span></span>
      <span class="dc-go" id="dailyCodeGo"></span>
    </a>
    <a class="dc-row" href="word.html?daily=1" id="dailyWord" data-game="word">
      <span class="dc-ic mt q" aria-hidden="true" id="dailyWordIc">A</span>
      <span class="dc-text"><strong id="dailyWordName"></strong><span id="dailyWordState"></span></span>
      <span class="dc-go" id="dailyWordGo"></span>
    </a>
    <p class="dc-reward" id="dailyReward"></p>
    <p class="dc-foot" id="dailyFoot"></p>
  </section>

  <nav class="games" aria-label="Games">
    <a class="gamecard" href="codebreaker.html" id="cardCodebreaker" data-game="codebreaker">
      <div class="gc-tiles" aria-hidden="true"><span class="mt o">4</span><span class="mt q">2</span><span class="mt x">7</span><span class="mt o">1</span></div>
      <div class="gc-body">
        <h2 id="nameCodebreaker">Codebreaker</h2>
        <p id="textCodebreaker"></p>
        <span class="chip" id="chipCodebreaker"></span>
      </div>
      <span class="gc-play"><span class="play-lbl">Play</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>
    <a class="gamecard" href="word.html" id="cardWord" data-game="word">
      <div class="gc-tiles" aria-hidden="true" id="tilesWord"><span class="mt o">W</span><span class="mt x">O</span><span class="mt q">R</span><span class="mt o">D</span></div>
      <div class="gc-body">
        <h2 id="nameWord">Word Puzzle</h2>
        <span class="lvl" id="lvlWord" hidden></span>
        <p id="textWord"></p>
        <span class="chip" id="chipWord"></span>
      </div>
      <span class="gc-play"><span class="play-lbl">Play</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>
  </nav>

  <button type="button" class="worldcard" id="cardWorld" hidden>
    <span class="wc-icon" aria-hidden="true">🏆</span>
    <span class="wc-text"><strong id="worldTitle"></strong><span id="worldText"></span></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <section class="contactcard" id="contactCard" aria-labelledby="contactTitle">
    <div class="cc-text"><strong id="contactTitle">Questions or ideas?</strong><span id="contactText"></span></div>
    <div class="cc-links">
      <a class="cc-link cc-wa" id="lnkWhatsApp" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l1.2-3.6A8 8 0 1 1 8.4 18.6z"/><path d="M9.2 8.4c.2-.4.6-.4.9-.4.3 0 .5.4.7 1 .1.4-.1.6-.4 1-.2.2 0 .6.5 1.2.6.6 1 .8 1.3.6.4-.3.6-.5 1-.4.6.2 1 .4 1 .7 0 .5-.3 1.2-1 1.4-.8.2-2.3-.2-3.6-1.5S8.6 9.9 9.2 8.4z"/></svg>
        <span id="lblWhatsApp">WhatsApp</span></a>
      <a class="cc-link" id="lnkEmail" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4.5 7l7.5 6 7.5-6"/></svg>
        <span id="lblEmail">E-mail</span></a>
    </div>
  </section>

  <footer class="homefoot">
    <a href="privacy.html" id="lnkPrivacy">Privacy policy</a>
    <span id="version"></span>
    <span>© 2026 MBG · Merkur Beqiri Games</span>
  </footer>
</div>
<dialog class="dlg" id="dlgConfirm" aria-labelledby="cfTitle">
  <form method="dialog" class="dlg-body">
    <h2 id="cfTitle"></h2>
    <p id="cfText"></p>
    <div class="dlg-actions">
      <button value="cancel" class="btn ghost" id="cfCancel"></button>
      <button value="ok" class="btn submit" id="cfOk"></button>
    </div>
  </form>
</dialog>

<div class="goodbye" id="goodbye" hidden>
  <div class="gb-inner">
    <div class="gb-mark" aria-hidden="true"><span class="mt o">M</span><span class="mt q">B</span><span class="mt x">G</span></div>
    <h2 id="gbTitle"></h2>
    <p id="gbText"></p>
    <p class="gb-sign" id="gbSign"></p>
    <p class="gb-close" id="gbClose"></p>
    <button type="button" class="btn submit" id="gbAgain"></button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">MBG Puzzles needs JavaScript. Please enable it in your browser settings.</p></noscript>
<script src="js/app/edition.js"></script>
<script src="js/vendor/capacitor.js"></script>
<script src="js/vendor/capacitor-app.js"></script>
<script src="js/vendor/native-purchases.js"></script>
<script src="js/app/i18n-app.js"></script>
<script src="js/app/access.js"></script>
<script src="js/app/app.js"></script>
<script src="js/app/flags.js"></script>
<script src="js/app/langmenu.js"></script>
<script src="js/app/billing.js"></script>
<script src="js/app/paywall.js"></script>
<script src="js/app/preview.js"></script>
<script src="js/app/credits.js"></script>
<script src="js/app/countries.js"></script>
<script src="js/app/world.js"></script>
<script src="js/shared/daily.js"></script>
<script src="js/app/home.js"></script>
</body>
</html>
